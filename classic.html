<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microsoft Copilot Studio Cost Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        :root {
            --ms-blue: #0078d4; --ms-blue-dark: #106ebe; --ms-blue-light: #deecf9;
            --ms-purple: #5c2d91; --ms-green: #107c10; --ms-orange: #ff8c00; --ms-red: #d13438;
            --bg-primary: #f3f2f1; --bg-secondary: #ffffff; --bg-tertiary: #faf9f8;
            --text-primary: #323130; --text-secondary: #605e5c; --text-muted: #a19f9d;
            --border-color: #edebe9;
            --shadow: 0 2px 4px rgba(0,0,0,0.04), 0 8px 16px rgba(0,0,0,0.08);
            --shadow-lg: 0 6px 20px rgba(0,0,0,0.1), 0 16px 40px rgba(0,0,0,0.12);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: var(--text-primary); padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: var(--bg-secondary); border-radius: 12px; padding: 24px 32px; margin-bottom: 24px; box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .logo { width: 48px; height: 48px; background: linear-gradient(135deg, var(--ms-blue) 0%, var(--ms-purple) 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .header h1 { font-size: 1.5rem; font-weight: 600; color: var(--text-primary); }
        .header p { font-size: 0.875rem; color: var(--text-secondary); margin-top: 2px; }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .lang-toggle { display: flex; background: var(--bg-tertiary); border-radius: 8px; padding: 4px; border: 1px solid var(--border-color); }
        .lang-btn { padding: 8px 16px; border: none; background: transparent; cursor: pointer; font-size: 0.875rem; font-weight: 500; color: var(--text-secondary); border-radius: 6px; transition: all 0.2s; }
        .lang-btn.active { background: var(--ms-blue); color: white; }
        .lang-btn:hover:not(.active) { background: var(--bg-primary); }
        .progress-container { background: var(--bg-secondary); border-radius: 12px; padding: 24px 32px; margin-bottom: 24px; box-shadow: var(--shadow); }
        .progress-steps { display: flex; justify-content: space-between; position: relative; }
        .progress-steps::before { content: ''; position: absolute; top: 20px; left: 40px; right: 40px; height: 3px; background: var(--border-color); z-index: 0; }
        .progress-step { display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; flex: 1; cursor: pointer; transition: transform 0.2s; }
        .progress-step:hover { transform: translateY(-2px); }
        .progress-step:hover .step-circle { box-shadow: 0 4px 12px rgba(0,120,212,0.3); }
        .step-circle { width: 40px; height: 40px; border-radius: 50%; background: var(--bg-tertiary); border: 3px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.875rem; color: var(--text-muted); transition: all 0.3s; }
        .progress-step.active .step-circle { background: var(--ms-blue); border-color: var(--ms-blue); color: white; }
        .progress-step.completed .step-circle { background: var(--ms-green); border-color: var(--ms-green); color: white; }
        .step-label { margin-top: 8px; font-size: 0.75rem; color: var(--text-muted); text-align: center; max-width: 100px; }
        .progress-step.active .step-label, .progress-step.completed .step-label { color: var(--text-primary); font-weight: 500; }
        .main-content { display: flex; gap: 24px; flex-wrap: wrap; }
        .calculator-section { flex: 2; min-width: 0; background: var(--bg-secondary); border-radius: 12px; padding: 32px; box-shadow: var(--shadow); }
        .summary-section { flex: 1; min-width: 300px; background: var(--bg-secondary); border-radius: 12px; padding: 24px; box-shadow: var(--shadow); position: sticky; top: 20px; height: fit-content; }
        /* Stack layout for step 3 (agent configuration needs more space) */
        .main-content.stack-layout { flex-direction: column; }
        .main-content.stack-layout .summary-section { position: static; width: 100%; max-width: none; }
        .step-content { display: none; }
        .step-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .step-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 8px; color: var(--text-primary); }
        .step-description { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 24px; line-height: 1.5; }
        .form-section { margin-bottom: 28px; }
        .form-section-title { font-size: 0.875rem; font-weight: 600; color: var(--ms-blue); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid var(--ms-blue-light); }
        .form-group { margin-bottom: 20px; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        label { display: block; font-size: 0.875rem; font-weight: 500; color: var(--text-primary); margin-bottom: 6px; }
        .label-with-info { display: flex; align-items: center; gap: 8px; }
        .info-icon { width: 18px; height: 18px; border-radius: 50%; background: var(--ms-blue-light); color: var(--ms-blue); font-size: 0.7rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; cursor: help; position: relative; }
        .info-icon:hover .tooltip { display: block; }
        .tooltip { display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: var(--text-primary); color: white; padding: 12px 16px; border-radius: 8px; font-size: 0.8rem; font-weight: 400; width: 280px; z-index: 100; margin-bottom: 8px; line-height: 1.5; box-shadow: var(--shadow-lg); }
        .tooltip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-top-color: var(--text-primary); }
        input[type="number"], input[type="text"], select { width: 100%; padding: 12px 16px; font-size: 0.9rem; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-tertiary); color: var(--text-primary); transition: all 0.2s; }
        input:focus, select:focus { outline: none; border-color: var(--ms-blue); box-shadow: 0 0 0 3px var(--ms-blue-light); }
        input[type="number"] { -moz-appearance: textfield; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; }
        .input-suffix { position: relative; }
        .input-suffix input { padding-right: 60px; }
        .input-suffix .suffix { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.8rem; }
        .info-box { background: var(--ms-blue-light); border-left: 4px solid var(--ms-blue); padding: 16px 20px; border-radius: 0 8px 8px 0; margin: 20px 0; }
        .info-box.warning { background: #fff4ce; border-left-color: var(--ms-orange); }
        .info-box.success { background: #dff6dd; border-left-color: var(--ms-green); }
        .info-box-title { font-weight: 600; font-size: 0.875rem; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        .info-box p { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.5; }
        .agent-table-container { overflow-x: auto; margin: 20px 0; }
        .agent-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .agent-table th { background: var(--bg-tertiary); padding: 12px 8px; text-align: left; font-weight: 600; color: var(--text-secondary); border-bottom: 2px solid var(--border-color); white-space: nowrap; }
        .agent-table td { padding: 10px 8px; border-bottom: 1px solid var(--border-color); }
        .agent-table input { padding: 8px 10px; font-size: 0.85rem; }
        .agent-table .agent-name-input { min-width: 140px; }
        .agent-table .small-input { width: 70px; text-align: center; }
        .agent-table .result-cell { font-weight: 600; color: var(--ms-blue); text-align: right; }
        .add-agent-btn { margin-top: 12px; padding: 10px 20px; background: var(--bg-tertiary); border: 2px dashed var(--border-color); border-radius: 8px; color: var(--text-secondary); font-size: 0.875rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; justify-content: center; width: 100%; }
        .add-agent-btn:hover { border-color: var(--ms-blue); color: var(--ms-blue); background: var(--ms-blue-light); }
        .remove-agent-btn { background: none; border: none; color: var(--ms-red); cursor: pointer; font-size: 1.2rem; padding: 4px 8px; opacity: 0.6; transition: opacity 0.2s; }
        .remove-agent-btn:hover { opacity: 1; }
        .btn { padding: 12px 24px; font-size: 0.9rem; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--ms-blue); color: white; }
        .btn-primary:hover { background: var(--ms-blue-dark); }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: var(--bg-primary); }
        .btn-success { background: var(--ms-green); color: white; }
        .btn-success:hover { background: #0b5c0b; }
        .button-row { display: flex; justify-content: space-between; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border-color); }
        .summary-title { font-size: 1rem; font-weight: 600; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid var(--ms-blue); color: var(--text-primary); }
        .summary-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); }
        .summary-item:last-child { border-bottom: none; }
        .summary-label { font-size: 0.85rem; color: var(--text-secondary); }
        .summary-value { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); }
        .summary-total { background: linear-gradient(135deg, var(--ms-blue) 0%, var(--ms-purple) 100%); color: white; padding: 20px; border-radius: 10px; margin-top: 20px; text-align: center; }
        .summary-total-label { font-size: 0.8rem; opacity: 0.9; margin-bottom: 4px; }
        .summary-total-value { font-size: 2rem; font-weight: 700; }
        .summary-total-sub { font-size: 0.85rem; opacity: 0.8; margin-top: 4px; }
        .summary-breakdown { margin-top: 20px; }
        .breakdown-title { font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .breakdown-item { display: flex; justify-content: space-between; font-size: 0.8rem; padding: 6px 0; color: var(--text-secondary); }
        .breakdown-item .value { font-weight: 500; color: var(--text-primary); }
        .export-btn { width: 100%; margin-top: 20px; padding: 14px; justify-content: center; }
        .result-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin: 24px 0; }
        .result-card { background: var(--bg-tertiary); border-radius: 10px; padding: 20px; text-align: center; border: 1px solid var(--border-color); }
        .result-card.highlight { background: linear-gradient(135deg, var(--ms-blue-light) 0%, #e8d4f8 100%); border-color: var(--ms-blue); }
        .result-card-value { font-size: 1.75rem; font-weight: 700; color: var(--ms-blue); margin-bottom: 4px; }
        .result-card-label { font-size: 0.8rem; color: var(--text-secondary); }
        .comparison-table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        .comparison-table th { background: var(--ms-blue); color: white; padding: 14px; text-align: left; font-weight: 600; }
        .comparison-table td { padding: 14px; border-bottom: 1px solid var(--border-color); }
        .comparison-table tr:nth-child(even) { background: var(--bg-tertiary); }
        .comparison-table .best { background: #dff6dd !important; }
        .comparison-table .best td:first-child::after { content: ' ✓'; color: var(--ms-green); font-weight: 600; }
        .radio-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .radio-card { padding: 16px; background: var(--bg-tertiary); border: 2px solid var(--border-color); border-radius: 10px; cursor: pointer; transition: all 0.2s; text-align: center; }
        .radio-card:hover { border-color: var(--ms-blue); }
        .radio-card.selected { border-color: var(--ms-blue); background: var(--ms-blue-light); }
        .radio-card input { display: none; }
        .radio-card-icon { font-size: 2rem; margin-bottom: 8px; }
        .radio-card-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
        .radio-card-desc { font-size: 0.75rem; color: var(--text-secondary); }
        .collapsible { margin: 16px 0; }
        .collapsible-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .collapsible-header:hover { background: var(--bg-primary); }
        .collapsible-header.open { border-radius: 8px 8px 0 0; }
        .collapsible-title { font-weight: 600; font-size: 0.9rem; }
        .collapsible-icon { transition: transform 0.2s; }
        .collapsible-header.open .collapsible-icon { transform: rotate(180deg); }
        .collapsible-content { display: none; padding: 20px; border: 1px solid var(--border-color); border-top: none; border-radius: 0 0 8px 8px; background: white; }
        .collapsible-content.open { display: block; }
        
        /* Agent Cards */
        .agent-card { background: var(--bg-tertiary); border: 2px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 16px; transition: all 0.2s; }
        .agent-card:hover { border-color: var(--ms-blue-light); box-shadow: var(--shadow); }
        .agent-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
        .agent-card-title { display: flex; align-items: center; gap: 12px; flex: 1; }
        .agent-card-title input { font-size: 1.1rem; font-weight: 600; border: none; background: transparent; padding: 4px 8px; border-radius: 4px; }
        .agent-card-title input:focus { background: white; outline: 2px solid var(--ms-blue); }
        .agent-card-summary { display: flex; gap: 16px; align-items: center; }
        .agent-card-stat { text-align: center; padding: 8px 16px; background: var(--ms-blue-light); border-radius: 8px; }
        .agent-card-stat-value { font-size: 1.2rem; font-weight: 700; color: var(--ms-blue); }
        .agent-card-stat-label { font-size: 0.7rem; color: var(--text-secondary); }
        .agent-card-body { display: grid; gap: 20px; }
        .agent-section { background: white; border-radius: 8px; padding: 16px; }
        .agent-section-title { font-size: 0.8rem; font-weight: 600; color: var(--ms-purple); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
        .agent-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
        .agent-field { display: flex; flex-direction: column; gap: 4px; }
        .agent-field label { font-size: 0.75rem; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
        .agent-field input { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.9rem; text-align: center; }
        .agent-field input:focus { border-color: var(--ms-blue); outline: none; box-shadow: 0 0 0 2px var(--ms-blue-light); }
        .credit-badge { display: inline-flex; align-items: center; justify-content: center; background: var(--ms-blue); color: white; font-size: 0.65rem; font-weight: 600; padding: 2px 6px; border-radius: 10px; margin-left: 4px; }
        .credit-badge.free { background: var(--ms-green); }
        .credit-badge.paid { background: var(--ms-orange); }
        .action-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
        .action-item { background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; text-align: center; }
        .action-item label { font-size: 0.75rem; color: var(--text-primary); display: block; margin-bottom: 6px; }
        .action-item input { width: 60px; padding: 6px; text-align: center; border: 1px solid var(--border-color); border-radius: 4px; }
        .remove-agent-btn { background: none; border: none; color: var(--ms-red); cursor: pointer; font-size: 1.5rem; padding: 4px 8px; opacity: 0.6; transition: opacity 0.2s; }
        .remove-agent-btn:hover { opacity: 1; }
        
        @media (max-width: 900px) { .main-content { flex-direction: column; } .summary-section { position: static; } .header { flex-direction: column; text-align: center; } .header-left { flex-direction: column; } .progress-steps { flex-wrap: wrap; gap: 12px; } .progress-steps::before { display: none; } .form-row { grid-template-columns: 1fr; } .resource-bar { flex-direction: column; gap: 12px; } .resource-links, .scenario-presets { flex-wrap: wrap; justify-content: center; } .agent-card-header { flex-direction: column; gap: 12px; } .agent-card-summary { width: 100%; justify-content: center; } }
        
        /* Resource Bar */
        .resource-bar { background: var(--bg-secondary); border-radius: 12px; padding: 16px 24px; margin-bottom: 16px; box-shadow: var(--shadow); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
        .resource-links, .scenario-presets { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .resource-links span, .scenario-presets span { font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); }
        .resource-links a { font-size: 0.8rem; color: var(--ms-blue); text-decoration: none; padding: 6px 12px; background: var(--ms-blue-light); border-radius: 6px; transition: all 0.2s; white-space: nowrap; }
        .resource-links a:hover { background: var(--ms-blue); color: white; }
        .preset-btn { padding: 6px 14px; font-size: 0.8rem; font-weight: 500; background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .preset-btn:hover { background: var(--ms-purple); color: white; border-color: var(--ms-purple); }
        
        /* Warnings */
        .warnings-container { margin-bottom: 16px; }
        .warning-box { background: #fff4ce; border: 1px solid var(--ms-orange); border-left: 4px solid var(--ms-orange); border-radius: 8px; padding: 14px 20px; display: flex; flex-direction: column; gap: 8px; }
        .warning-item { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: #6d5700; }
        .warning-item .icon { font-size: 1.1rem; }
        
        /* Small Button */
        .btn-sm { padding: 8px 14px; font-size: 0.8rem; }
        
        /* Footer */
        .footer { background: var(--bg-secondary); border-radius: 12px; padding: 20px 32px; margin-top: 24px; box-shadow: var(--shadow); text-align: center; }
        .footer-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
        .footer-left { text-align: left; }
        .footer-disclaimer { font-size: 0.75rem; color: var(--text-muted); line-height: 1.5; max-width: 600px; }
        .footer-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        .footer-version { font-size: 0.8rem; font-weight: 600; color: var(--ms-blue); }
        .footer-date { font-size: 0.7rem; color: var(--text-muted); }
        @media (max-width: 600px) { .footer-content { flex-direction: column; text-align: center; } .footer-left, .footer-right { text-align: center; align-items: center; } }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-left">
                <div class="logo">🤖</div>
                <div>
                    <h1 id="headerTitle"></h1>
                    <p id="headerSubtitle"></p>
                </div>
            </div>
            <div class="header-right">
                <button class="btn btn-secondary btn-sm" onclick="resetCalculator()" title="Reset">🔄 Reset</button>
                <div class="lang-toggle">
                    <button class="lang-btn active" onclick="setLanguage('de')">DE</button>
                    <button class="lang-btn" onclick="setLanguage('en')">EN</button>
                </div>
            </div>
        </header>

        <!-- Resource Links Bar -->
        <div class="resource-bar">
            <div class="resource-links">
                <span id="resourcesLabel">📚 Ressourcen:</span>
                <a href="https://www.microsoft.com/licensing/docs/view/Licensing-Guides" target="_blank" id="linkLicensingGuide">📄 Microsoft Licensing Guide</a>
                <a href="https://microsoft.github.io/copilot-studio-estimator/" target="_blank" id="linkEstimator">🧮 MS Credit Estimator</a>
                <a href="https://learn.microsoft.com/en-us/microsoft-copilot-studio/billing-and-licensing" target="_blank" id="linkDocs">📖 Microsoft Learn</a>
            </div>
            <div class="scenario-presets">
                <span id="presetsLabel">⚡ Schnellstart:</span>
                <button class="preset-btn" onclick="loadPreset('small')" id="presetSmall">Klein</button>
                <button class="preset-btn" onclick="loadPreset('medium')" id="presetMedium">Mittelstand</button>
                <button class="preset-btn" onclick="loadPreset('enterprise')" id="presetEnterprise">Enterprise</button>
            </div>
        </div>

        <!-- Validation Warnings -->
        <div class="warnings-container" id="warningsContainer" style="display: none;">
            <div class="warning-box" id="warningBox"></div>
        </div>

        <div class="progress-container">
            <div class="progress-steps">
                <div class="progress-step active" data-step="1" onclick="goToStep(1)"><div class="step-circle">1</div><span class="step-label" id="stepLabel1"></span></div>
                <div class="progress-step" data-step="2" onclick="goToStep(2)"><div class="step-circle">2</div><span class="step-label" id="stepLabel2"></span></div>
                <div class="progress-step" data-step="3" onclick="goToStep(3)"><div class="step-circle">3</div><span class="step-label" id="stepLabel3"></span></div>
                <div class="progress-step" data-step="4" onclick="goToStep(4)"><div class="step-circle">4</div><span class="step-label" id="stepLabel4"></span></div>
            </div>
        </div>

        <div class="main-content">
            <div class="calculator-section">
                <!-- Step 1 -->
                <div class="step-content active" id="step1">
                    <h2 class="step-title" id="step1Title"></h2>
                    <p class="step-description" id="step1Desc"></p>

        function checkValidation() {
            const warnings = [];
            const totalUsers = parseInt(document.getElementById('totalUsers').value) || 0;
            const m365CopilotUsers = parseInt(document.getElementById('m365CopilotUsers').value) || 0;
            
            // Check M365 Copilot > Total Users
            if (m365CopilotUsers > totalUsers) {
                warnings.push({ icon: '⚠️', text: t('warningM365Exceeded') });
            }
            
            // Check agent M365 users
            agents.forEach(agent => {
                if (agent.m365Users > agent.users) {
                    warnings.push({ icon: '⚠️', text: `${agent.name}: ${t('warningAgentM365Exceeded')}` });
                }
            });
            
            // Check >125% capacity
            const costs = calculateCosts();
            if (costs.licenseModel === 'prepaid' || costs.licenseModel === 'hybrid') {
                const packCapacity = costs.recommendedPacks * PRICING.creditsPerPack;
                const utilization = (costs.totalCredits / packCapacity) * 100;
                if (utilization > 125) {
                    warnings.push({ icon: '🚨', text: t('warningCapacity125') });
                }
            }
            
            // Display warnings
            const container = document.getElementById('warningsContainer');
            const box = document.getElementById('warningBox');
            
            if (warnings.length > 0) {
                container.style.display = 'block';
                box.innerHTML = warnings.map(w => 
                    `<div class="warning-item"><span class="icon">${w.icon}</span><span>${w.text}</span></div>`
                ).join('');
            } else {
                container.style.display = 'none';
            }
        }

        // Keep old function for compatibility but redirect to new one

        // Calculations
        const PRICING = {
            prepaidPackPrice: 200, creditsPerPack: 25000, paygPricePerCredit: 0.01,
            dataverseDbPerGb: 40, dataverseFilePerGb: 2, powerAppsPremium: 20,
            defaultDbCapacity: 15, defaultFileCapacity: 20,
            powerAppsFirstDbCapacity: 20, powerAppsAdditionalDbCapacity: 0.25,
            powerAppsFirstFileCapacity: 20, powerAppsAdditionalFileCapacity: 2
        };

        // Credit rates - separated by M365 Copilot zero-rating
        const CREDIT_RATES_FREE_FOR_M365 = {
            classic: 1,
            generative: 2,
            graph: 10,
            actions: 5,
            flowActions: 0.13  // 13 per 100
        };
        
        const CREDIT_RATES_ALWAYS_CHARGED = {
            autonomous: 25,
            aiBasic: 0.1,
            aiStandard: 1,
            aiPremium: 10,
            contentProcessing: 8
        };

        function calculateCreditsPerSession(agent) {
            // Free credits (for M365 Copilot users these are 0, for others they count)
            const freeCredits = 
                (agent.classic * CREDIT_RATES_FREE_FOR_M365.classic) + 
                (agent.generative * CREDIT_RATES_FREE_FOR_M365.generative) + 
                (agent.graph * CREDIT_RATES_FREE_FOR_M365.graph) + 
                (agent.actions * CREDIT_RATES_FREE_FOR_M365.actions) +
                (agent.flowActions * CREDIT_RATES_FREE_FOR_M365.flowActions);
            
            // Always charged credits
            const chargedCredits = 
                (agent.autonomous * CREDIT_RATES_ALWAYS_CHARGED.autonomous) +
                (agent.aiBasic * CREDIT_RATES_ALWAYS_CHARGED.aiBasic) +
                (agent.aiStandard * CREDIT_RATES_ALWAYS_CHARGED.aiStandard) +
                (agent.aiPremium * CREDIT_RATES_ALWAYS_CHARGED.aiPremium) +
                (agent.contentProcessing * CREDIT_RATES_ALWAYS_CHARGED.contentProcessing);
            
            return freeCredits + chargedCredits;
        }

        function calculateAgentCredits(agent) {
            const totalSessions = agent.users * agent.sessions;
            const m365Sessions = Math.min(agent.m365Users, agent.users) * agent.sessions;
            const nonM365Sessions = totalSessions - m365Sessions;
            
            // Calculate free credits (0 for M365, full for others)
            const freeCreditsPerSession = 
                (agent.classic * CREDIT_RATES_FREE_FOR_M365.classic) + 
                (agent.generative * CREDIT_RATES_FREE_FOR_M365.generative) + 
                (agent.graph * CREDIT_RATES_FREE_FOR_M365.graph) + 
                (agent.actions * CREDIT_RATES_FREE_FOR_M365.actions) +
                (agent.flowActions * CREDIT_RATES_FREE_FOR_M365.flowActions);
            
            // Calculate always-charged credits
            const chargedCreditsPerSession = 
                (agent.autonomous * CREDIT_RATES_ALWAYS_CHARGED.autonomous) +
                (agent.aiBasic * CREDIT_RATES_ALWAYS_CHARGED.aiBasic) +
                (agent.aiStandard * CREDIT_RATES_ALWAYS_CHARGED.aiStandard) +
                (agent.aiPremium * CREDIT_RATES_ALWAYS_CHARGED.aiPremium) +
                (agent.contentProcessing * CREDIT_RATES_ALWAYS_CHARGED.contentProcessing);
            
            // M365 users only pay for charged actions
            const m365Credits = m365Sessions * chargedCreditsPerSession;
            
            // Non-M365 users pay for everything
            const nonM365Credits = nonM365Sessions * (freeCreditsPerSession + chargedCreditsPerSession);
            
            return m365Credits + nonM365Credits;
        }

        function calculateTotalCredits() { return agents.reduce((sum, agent) => sum + calculateAgentCredits(agent), 0); }

        function calculateDataverseNeeds() {
            const managedEnvs = parseInt(document.getElementById('managedEnvs').value) || 0;
            const dbPerEnv = parseFloat(document.getElementById('dbPerEnv').value) || 0;
            const filePerEnv = parseFloat(document.getElementById('filePerEnv').value) || 0;
            const powerAppsUsers = parseInt(document.getElementById('powerAppsPremiumUsers').value) || 0;
            const dbNeeded = managedEnvs * dbPerEnv;
            const fileNeeded = managedEnvs * filePerEnv;
            let dbAvailable = PRICING.defaultDbCapacity;
            let fileAvailable = PRICING.defaultFileCapacity;
            if (powerAppsUsers > 0) {
                dbAvailable = Math.max(dbAvailable, PRICING.powerAppsFirstDbCapacity);
                fileAvailable = Math.max(fileAvailable, PRICING.powerAppsFirstFileCapacity);
                if (powerAppsUsers > 1) {
                    dbAvailable += (powerAppsUsers - 1) * PRICING.powerAppsAdditionalDbCapacity;
                    fileAvailable += (powerAppsUsers - 1) * PRICING.powerAppsAdditionalFileCapacity;
                }
            }
            return { dbNeeded, fileNeeded, dbAvailable, fileAvailable, dbShortfall: Math.max(0, dbNeeded - dbAvailable), fileShortfall: Math.max(0, fileNeeded - fileAvailable) };
        }

        function calculateCapacityOptions(shortfall) {
            const options = [];
            if (shortfall.dbShortfall > 0 || shortfall.fileShortfall > 0) {
                const dbAddOnCost = Math.ceil(shortfall.dbShortfall) * PRICING.dataverseDbPerGb;
                const fileAddOnCost = Math.ceil(shortfall.fileShortfall) * PRICING.dataverseFilePerGb;
                options.push({ name: t('dataverseAddon'), dbCapacity: `+${Math.ceil(shortfall.dbShortfall)} GB`, fileCapacity: `+${Math.ceil(shortfall.fileShortfall)} GB`, cost: dbAddOnCost + fileAddOnCost, type: 'addon' });
                const existingPowerApps = parseInt(document.getElementById('powerAppsPremiumUsers').value) || 0;
                let licensesNeeded = 0, dbFromLicenses = 0;
                if (shortfall.dbShortfall > 0) {
                    if (existingPowerApps === 0) { licensesNeeded = 1; dbFromLicenses = PRICING.powerAppsFirstDbCapacity; }
                    if (dbFromLicenses < shortfall.dbShortfall) { licensesNeeded += Math.ceil((shortfall.dbShortfall - dbFromLicenses) / PRICING.powerAppsAdditionalDbCapacity); }
                }
                if (licensesNeeded > 0) options.push({ name: t('powerAppsLicenses'), dbCapacity: `${licensesNeeded} ${t('licenses')}`, fileCapacity: '–', cost: licensesNeeded * PRICING.powerAppsPremium, type: 'powerApps', licensesNeeded });
            }
            options.sort((a, b) => a.cost - b.cost);
            if (options.length > 0) options[0].isBest = true;
            return options;
        }

        function calculateCosts() {
            const totalCredits = calculateTotalCredits();
            const licenseModel = document.querySelector('input[name="licenseModel"]:checked')?.value || 'prepaid';
            const dataverseNeeds = calculateDataverseNeeds();
            const capacityOptions = calculateCapacityOptions(dataverseNeeds);
            let copilotStudioCost = 0, paygOverage = 0, recommendedPacks = 0;
            if (licenseModel === 'prepaid' || licenseModel === 'hybrid') {
                recommendedPacks = Math.max(1, Math.ceil(totalCredits / PRICING.creditsPerPack));
                const includedCredits = recommendedPacks * PRICING.creditsPerPack;
                copilotStudioCost = recommendedPacks * PRICING.prepaidPackPrice;
                if (licenseModel === 'hybrid' && totalCredits > includedCredits) paygOverage = (totalCredits - includedCredits) * PRICING.paygPricePerCredit;
            } else { copilotStudioCost = totalCredits * PRICING.paygPricePerCredit; }
            
            // Dataverse Add-On cost (if capacity exceeded)
            let dataverseCost = capacityOptions.length > 0 ? capacityOptions[0].cost : 0;
            
            // Power Apps Premium license costs (existing users)
            const powerAppsUsers = parseInt(document.getElementById('powerAppsPremiumUsers').value) || 0;
            const powerAppsCost = powerAppsUsers * PRICING.powerAppsPremium;
            
            const totalMonthly = copilotStudioCost + dataverseCost + paygOverage + powerAppsCost;
            return { 
                totalCredits, recommendedPacks, copilotStudioCost, dataverseCost, paygOverage, 
                powerAppsCost, powerAppsUsers,
                totalMonthly, totalYearly: totalMonthly * 12, 
                dataverseNeeds, capacityOptions, licenseModel 
            };
        }

        function updateRecommendations(costs) {
            const recs = [];
            const m365 = parseInt(document.getElementById('m365CopilotUsers').value) || 0;
            const total = parseInt(document.getElementById('totalUsers').value) || 1;
            const paygCost = costs.totalCredits * PRICING.paygPricePerCredit;
            if (costs.copilotStudioCost < paygCost && costs.licenseModel !== 'payg') recs.push(t('recPrepaid'));
            else if (costs.totalCredits < 15000) recs.push(t('recPayg'));
            if (m365 < total * 0.3) recs.push(t('recM365Copilot'));
            if (costs.dataverseNeeds.dbShortfall <= 0) recs.push(t('recCapacityOk'));
            document.getElementById('recommendationsText').innerHTML = recs.map(r => `• ${r}`).join('<br>');
        }

                const cell = ws3.getCell(5, i + 2);
                cell.value = v;
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: dbOk ? colors.greenLight : colors.orangeLight } };
                cell.font = { name: 'Segoe UI', size: 10, color: { argb: dbOk ? colors.green : colors.orange } };
                cell.alignment = { horizontal: 'center' };
            });

            // File row
            const fileOk = costs.dataverseNeeds.fileShortfall <= 0;
            ['File Storage', costs.dataverseNeeds.fileNeeded.toFixed(1) + ' GB', costs.dataverseNeeds.fileAvailable.toFixed(1) + ' GB',
             (fileOk ? '' : '+') + costs.dataverseNeeds.fileShortfall.toFixed(1) + ' GB', fileOk ? '✓ OK' : '⚠️'].forEach((v, i) => {
                const cell = ws3.getCell(6, i + 2);
                cell.value = v;
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: fileOk ? colors.greenLight : colors.orangeLight } };
                cell.font = { name: 'Segoe UI', size: 10, color: { argb: fileOk ? colors.green : colors.orange } };
                cell.alignment = { horizontal: 'center' };
            });

            // ==================== SHEET 4: Credit Reference ====================
            const ws4 = workbook.addWorksheet(currentLang === 'de' ? 'Credit Referenz' : 'Credit Reference', {
                properties: { tabColor: { argb: colors.green } }
            });

            ws4.columns = [{ width: 5 }, { width: 25 }, { width: 12 }, { width: 40 }, { width: 20 }];

            ws4.mergeCells('B2:E2');
            const ws4Title = ws4.getCell('B2');
            ws4Title.value = currentLang === 'de' ? '📖 COPILOT STUDIO CREDIT REFERENZ' : '📖 COPILOT STUDIO CREDIT REFERENCE';
            ws4Title.font = { name: 'Segoe UI', size: 16, bold: true, color: { argb: colors.white } };
            ws4Title.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: colors.green } };
            ws4Title.alignment = { horizontal: 'center', vertical: 'middle' };
            ws4.getRow(2).height = 35;

            // Credit rates header
            [currentLang === 'de' ? 'Antworttyp' : 'Response Type', 'Credits', currentLang === 'de' ? 'Beschreibung' : 'Description', 'M365 Copilot'].forEach((h, i) => {
                const cell = ws4.getCell(4, i + 2);
                cell.value = h;
                cell.font = { name: 'Segoe UI', size: 10, bold: true, color: { argb: colors.white } };
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: colors.blue } };
                cell.alignment = { horizontal: 'center' };
            });

            const creditRates = [
                ['Classic Answers', '1', currentLang === 'de' ? 'Vordefinierte FAQ-Antworten' : 'Predefined FAQ responses', true],
                ['Generative Answers', '2', currentLang === 'de' ? 'KI-generierte Antworten' : 'AI-generated answers', true],
                ['Graph Grounding', '10', currentLang === 'de' ? 'SharePoint/M365 Daten' : 'SharePoint/M365 data', true],
                ['Agent Actions', '5', currentLang === 'de' ? 'Trigger, Tools' : 'Triggers, tools', true],
                ['Flow Actions', '13/100', currentLang === 'de' ? 'Pro 100 Flow-Aktionen' : 'Per 100 flow actions', true],
                ['Autonomous', '25', currentLang === 'de' ? 'Automatische Auslösung' : 'Auto triggering', false],
                ['AI Basic', '0.1', currentLang === 'de' ? 'Einfache KI-Tasks' : 'Simple AI tasks', false],
                ['AI Standard', '1', currentLang === 'de' ? 'Mittlere KI-Tasks' : 'Medium AI tasks', false],
                ['AI Premium', '10', currentLang === 'de' ? 'Reasoning-Modelle' : 'Reasoning models', false],
                ['Content Proc.', '8', currentLang === 'de' ? 'Pro Seite (PDF etc.)' : 'Per page (PDF)', false]
            ];

            creditRates.forEach((row, idx) => {
                const rowNum = 5 + idx;
                const isFree = row[3];
                [row[0], row[1], row[2], isFree ? '✓ Free' : '⚠️ Charged'].forEach((v, colIdx) => {
                    const cell = ws4.getCell(rowNum, colIdx + 2);
                    cell.value = v;
                    cell.font = { name: 'Segoe UI', size: 10, color: { argb: colIdx === 3 ? (isFree ? colors.green : colors.orange) : colors.black } };
                    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: idx % 2 === 0 ? colors.white : colors.gray } };
                    cell.alignment = { horizontal: colIdx === 2 ? 'left' : 'center' };
                });
            });

            // Save file
            const buffer = await workbook.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            saveAs(blob, `Copilot_Studio_Kalkulation_${today.toISOString().split('T')[0]}.xlsx`);
        }
    </script>
</body>
</html>
